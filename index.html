<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Normies Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #12121a;
      --bg-tertiary: #1a1a25;
      --bg-card: #16161f;
      --text-primary: #e8e8ed;
      --text-secondary: #8b8b9a;
      --text-muted: #5a5a6e;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --border: #2a2a3a;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
    }

    header {
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(10px);
    }

    .header-content {
      max-width: 1800px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-family: 'Space Mono', monospace;
      font-size: 1.5rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--accent), #a855f7);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      max-width: 1800px;
      margin: 0 auto;
      padding: 1.5rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1rem;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow: 0 8px 30px rgba(99, 102, 241, 0.15);
    }

    .card-image {
      aspect-ratio: 1;
      background: var(--bg-tertiary);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.5rem;
      position: relative;
    }

    .card-image img, .card-image svg {
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
    }

    .card-image .loading-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-tertiary);
      color: var(--text-muted);
      font-size: 0.75rem;
    }

    .card-image img.hidden { display: none; }

    .card-info {
      padding: 0.75rem;
    }

    .card-name {
      font-weight: 600;
      font-size: 0.85rem;
      margin-bottom: 0.5rem;
      font-family: 'Space Mono', monospace;
    }

    .card-traits {
      display: flex;
      flex-wrap: wrap;
      gap: 0.375rem;
    }

    .trait-tag {
      font-size: 0.65rem;
      padding: 0.2rem 0.4rem;
      background: var(--bg-tertiary);
      border-radius: 6px;
      color: var(--text-secondary);
    }

    .load-more {
      text-align: center;
      padding: 2rem;
    }

    .load-more button {
      padding: 0.75rem 2rem;
      background: var(--accent);
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      font-family: inherit;
    }

    .load-more button:hover {
      background: var(--accent-hover);
    }

    .load-more button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-secondary); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  </style>
</head>
<body>
  <header>
    <div class="header-content">
      <div class="logo">
        <div class="logo-icon">◈</div>
        Normies Gallery
      </div>
    </div>
  </header>

  <div class="container">
    <div class="grid" id="grid"></div>
    <div class="load-more">
      <button id="loadMore" onclick="loadMore()">Load More</button>
    </div>
  </div>

  <script>
    const API_BASE = 'https://api.normies.art';
    const PER_PAGE = 50;
    let currentStart = 0;
    let isLoading = false;
    let loadedIds = new Set();

    const TRAIT_CATEGORIES = ['Type', 'Gender', 'Age', 'Hair Style', 'Facial Feature', 'Eyes', 'Expression', 'Accessory'];

    async function fetchNormie(id) {
      try {
        const res = await fetch(`${API_BASE}/normie/${id}/metadata`);
        if (!res.ok) return null;
        return await res.json();
      } catch (e) {
        console.error(`Error fetching ${id}:`, e);
        return null;
      }
    }

    async function loadMore() {
      if (isLoading) return;
      isLoading = true;
      
      const btn = document.getElementById('loadMore');
      btn.disabled = true;
      btn.textContent = 'Loading...';

      const grid = document.getElementById('grid');
      const ids = [];
      
      // Find next batch of IDs
      for (let i = currentStart; ids.length < PER_PAGE && i < 10000; i++) {
        if (!loadedIds.has(i)) {
          ids.push(i);
          loadedIds.add(i);
        }
      }

      // Fetch in smaller batches with delays
      const BATCH = 10;
      for (let i = 0; i < ids.length; i += BATCH) {
        const batch = ids.slice(i, i + BATCH);
        const results = await Promise.all(batch.map(id => fetchNormie(id)));
        
        for (const normie of results) {
          if (!normie) continue;
          
          const traits = normie.attributes
            .filter(a => TRAIT_CATEGORIES.includes(a.trait_type))
            .slice(0, 3);

          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <div class="card-image">
              <div class="loading-placeholder">Loading...</div>
              <img src="${API_BASE}/normie/${normie.name.split('#')[1]}/image.svg" 
                   alt="${normie.name}"
                   onload="this.previousElementSibling.remove(); this.classList.remove('hidden')"
                   onerror="this.style.display='none'; this.previousElementSibling.textContent='Failed'">
            </div>
            <div class="card-info">
              <div class="card-name">${normie.name}</div>
              <div class="card-traits">
                ${traits.map(t => `<span class="trait-tag">${t.value}</span>`).join('')}
              </div>
            </div>
          `;
          grid.appendChild(card);
        }
        
        // Small delay between batches
        await new Promise(r => setTimeout(r, 100));
      }

      currentStart = Math.max(...ids) + 1;
      btn.disabled = false;
      btn.textContent = 'Load More';
      isLoading = false;
    }

    // Initial load
    loadMore();
  </script>
</body>
</html>
