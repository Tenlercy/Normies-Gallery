<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Normies Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #12121a;
      --bg-tertiary: #1a1a25;
      --bg-card: #16161f;
      --text-primary: #e8e8ed;
      --text-secondary: #8b8b9a;
      --text-muted: #5a5a6e;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --border: #2a2a3a;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
    }

    header {
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(10px);
    }

    .header-content {
      max-width: 1800px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .logo {
      font-family: 'Space Mono', monospace;
      font-size: 1.5rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--accent), #a855f7);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      max-width: 1800px;
      margin: 0 auto;
      padding: 1.5rem;
    }

    .hero {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      align-items: flex-end;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    .hero-copy h1 {
      font-size: clamp(1.2rem, 2vw, 1.8rem);
      margin-bottom: 0.35rem;
    }

    .hero-copy p {
      color: var(--text-secondary);
      font-size: 0.95rem;
    }

    .status-pill {
      border: 1px solid var(--border);
      background: var(--bg-secondary);
      border-radius: 999px;
      padding: 0.45rem 0.8rem;
      font-size: 0.8rem;
      color: var(--text-secondary);
      font-family: 'Space Mono', monospace;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1rem;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow: 0 8px 30px rgba(99, 102, 241, 0.15);
    }

    .card-image {
      aspect-ratio: 1;
      background: var(--bg-tertiary);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.5rem;
      position: relative;
    }

    .card-image img, .card-image svg {
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
    }

    .card-image .loading-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-tertiary);
      color: var(--text-muted);
      font-size: 0.75rem;
    }

    .card-image img.hidden { display: none; }

    .card-info {
      padding: 0.75rem;
    }

    .card-name {
      font-weight: 600;
      font-size: 0.85rem;
      margin-bottom: 0.5rem;
      font-family: 'Space Mono', monospace;
    }

    .card-traits {
      display: flex;
      flex-wrap: wrap;
      gap: 0.375rem;
    }

    .trait-tag {
      font-size: 0.65rem;
      padding: 0.2rem 0.4rem;
      background: var(--bg-tertiary);
      border-radius: 6px;
      color: var(--text-secondary);
    }

    .load-more {
      text-align: center;
      padding: 2rem;
    }

    .status-text {
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.9rem;
      min-height: 1.3rem;
      margin-top: -0.5rem;
      margin-bottom: 0.75rem;
    }

    .load-more button {
      padding: 0.75rem 2rem;
      background: var(--accent);
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      font-family: inherit;
    }

    .load-more button:hover {
      background: var(--accent-hover);
    }

    .load-more button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-secondary); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  </style>
</head>
<body>
  <header>
    <div class="header-content">
      <div class="logo">
        <div class="logo-icon">◈</div>
        Normies Gallery
      </div>
      <div class="status-pill" id="progressPill">0 loaded</div>
    </div>
  </header>

  <div class="container">
    <section class="hero">
      <div class="hero-copy">
        <h1>Discover the entire Normies collection</h1>
        <p>Fast-loading cards, curated trait tags, and smooth browsing for collectors.</p>
      </div>
    </section>
    <div class="grid" id="grid"></div>
    <p class="status-text" id="statusText" aria-live="polite"></p>
    <div class="load-more">
      <button id="loadMore">Load More</button>
    </div>
  </div>

  <script>
    const API_BASE = 'https://api.normies.art';
    const PER_PAGE = 50;
    let currentStart = 0;
    let isLoading = false;
    let loadedCount = 0;
    let loadedIds = new Set();
    const MAX_ID = 10000;

    const TRAIT_CATEGORIES = ['Type', 'Gender', 'Age', 'Hair Style', 'Facial Feature', 'Eyes', 'Expression', 'Accessory'];

    async function fetchNormie(id) {
      try {
        const res = await fetch(`${API_BASE}/normie/${id}/metadata`);
        if (!res.ok) return null;
        return await res.json();
      } catch (e) {
        console.error(`Error fetching ${id}:`, e);
        return null;
      }
    }

    async function loadMore() {
      if (isLoading) return;
      isLoading = true;

      const btn = document.getElementById('loadMore');
      const statusText = document.getElementById('statusText');
      btn.disabled = true;
      btn.textContent = 'Loading...';
      statusText.textContent = 'Fetching next batch...';

      const grid = document.getElementById('grid');
      const ids = [];

      // Find next batch of IDs
      for (let i = currentStart; ids.length < PER_PAGE && i < MAX_ID; i++) {
        if (!loadedIds.has(i)) {
          ids.push(i);
          loadedIds.add(i);
        }
      }

      if (!ids.length) {
        statusText.textContent = 'No more items available.';
        btn.textContent = 'All Loaded';
        isLoading = false;
        return;
      }

      // Fetch in smaller batches with delays
      const BATCH = 10;
      let appendedThisRun = 0;

      for (let i = 0; i < ids.length; i += BATCH) {
        const batch = ids.slice(i, i + BATCH);
        const results = await Promise.all(batch.map(id => fetchNormie(id)));

        const fragment = document.createDocumentFragment();
        for (const normie of results) {
          if (!normie) continue;

          const traits = normie.attributes
            .filter(a => TRAIT_CATEGORIES.includes(a.trait_type))
            .slice(0, 3);

          const card = document.createElement('div');
          card.className = 'card';

          const imageWrap = document.createElement('div');
          imageWrap.className = 'card-image';

          const placeholder = document.createElement('div');
          placeholder.className = 'loading-placeholder';
          placeholder.textContent = 'Loading...';

          const img = document.createElement('img');
          const imageId = normie.name.split('#')[1];
          img.src = `${API_BASE}/normie/${imageId}/image.svg`;
          img.alt = normie.name;
          img.classList.add('hidden');
          img.addEventListener('load', () => {
            placeholder.remove();
            img.classList.remove('hidden');
          });
          img.addEventListener('error', () => {
            img.style.display = 'none';
            placeholder.textContent = 'Failed';
          });

          imageWrap.append(placeholder, img);

          const info = document.createElement('div');
          info.className = 'card-info';

          const name = document.createElement('div');
          name.className = 'card-name';
          name.textContent = normie.name;

          const traitsWrap = document.createElement('div');
          traitsWrap.className = 'card-traits';

          for (const trait of traits) {
            const tag = document.createElement('span');
            tag.className = 'trait-tag';
            tag.textContent = trait.value;
            traitsWrap.appendChild(tag);
          }

          info.append(name, traitsWrap);
          card.append(imageWrap, info);
          fragment.appendChild(card);
          appendedThisRun += 1;
        }

        grid.appendChild(fragment);
        // Small delay between batches
        await new Promise(r => setTimeout(r, 100));
      }

      currentStart = Math.max(...ids) + 1;
      loadedCount += appendedThisRun;
      document.getElementById('progressPill').textContent = `${loadedCount} loaded`;

      if (currentStart >= MAX_ID) {
        btn.disabled = true;
        btn.textContent = 'All Loaded';
        statusText.textContent = 'Reached collection limit.';
      } else {
        btn.disabled = false;
        btn.textContent = 'Load More';
        statusText.textContent = appendedThisRun
          ? `Added ${appendedThisRun} new cards.`
          : 'No cards returned in this batch.';
      }

      isLoading = false;
    }

    document.getElementById('loadMore').addEventListener('click', loadMore);

    // Initial load
    loadMore();
  </script>
</body>
</html>
